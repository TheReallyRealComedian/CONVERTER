[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# ARCH-BUILD (2026-10-06): benannte Fremd-Filter statt eines globalen
# `ignore::DeprecationWarning`, der 788 Warnungen je Lauf verdeckte (gemessen
# mit -W default; Zaehlung je Quelle im Sprint-Bericht). Alles andere ist
# sichtbar.
#   1. Flask-Login 0.6.3 ruft datetime.utcnow() auf (591 je Lauf) — faellt
#      mit einem Flask-Login-Bump von selbst weg; Filter per Modul.
#   2. SQLAlchemy 2.x: Query.get() ist Legacy (LegacyAPIWarning) — 4 direkte
#      Stellen + 7 get_or_404 in app_pkg (gezaehlt 2026-10-06), dazu die
#      Tests. Folge-Item QUERY-GET (XS): auf db.session.get umstellen, dann
#      diese Zeile streichen; Filter per Kategorie.
filterwarnings =
    ignore:datetime.datetime.utcnow:DeprecationWarning:flask_login.login_manager
    ignore::sqlalchemy.exc.LegacyAPIWarning
