services:
  # 1. Redis - Job Queue Database (internal only, no port exposed)
  redis:
    image: redis:8.4-alpine
    container_name: file-transformer-redis
    # SEC-REDIS-AUTH (F-7): Redis verlangt ein Passwort aus .env — fail-closed,
    # ohne REDIS_PASSWORD startet Compose nichts (auch nicht Web/Worker unten).
    # Es reist per Env, nicht als Klartext im Compose. Der Umweg ueber
    # docker-entrypoint.sh ist Pflicht: nur wenn dessen erstes Argument
    # redis-server ist, dropt er auf den User redis und laedt die Module — ein
    # nacktes `sh -c "exec redis-server …"` liefe als root (gemessen). Redis
    # ueberschreibt seinen Prozesstitel, `ps` zeigt das Passwort nicht;
    # `docker inspect` zeigt es in Env wie jedes andere Secret der Box.
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD fehlt in .env}
    command: ["sh", "-c", "exec docker-entrypoint.sh redis-server --requirepass \"$$REDIS_PASSWORD\""]
    # redis-cli endet auch bei NOAUTH/WRONGPASS mit Exit 0 — erst das grep
    # macht aus der Antwort ein Urteil.
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # 2. Web Container (Flask API)
  markdown-converter:
    build:
      context: .
      cache_from:
        - converter-app:latest
    image: converter-app:latest
    container_name: markdown-converter-web
    dns:
      - 8.8.8.8
      - 8.8.4.4
    ports:
      # SEC-AUDIT: loopback only. Host nginx (proxy_pass 127.0.0.1:5656) is
      # the one way in from outside; the iOS app goes through nginx (https),
      # converter-mcp through Docker DNS (:5000). 0.0.0.0 served the app to
      # the LAN without TLS, past nginx's HSTS and login rate limit — and
      # ProxyFix trusts the X-Forwarded-* headers of whoever connects here.
      - "127.0.0.1:5656:5000"
    volumes:
      - ./google-credentials.json:/app/google-credentials.json:ro
      # Shared volume for podcast files
      - podcast_data:/app/output_podcasts
      # Persistent database storage
      - app_data:/app/data
      # DOC-WEB-ASYNC: NO docker socket and NO mineru wiring on this
      # container. It is reachable from the internet (converter.smallpieces.de,
      # login-protected) — a ROOT-EQUIVALENT socket behind a single login
      # fence was the wrong trade. Browser PDFs run as a job on the worker
      # (the only socket holder); the upload travels over the shared
      # podcast_data volume, the worker's exchange bind is never touched here.
    environment:
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS}
      # SEC-REDIS-AUTH: token_urlsafe-Passwort, URL-sicher ohne Escaping.
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD fehlt in .env}@redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - NOTION_MCP_URL=http://notion-mcp-server:3333
      - MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN}
      - NOTION_TOKEN=${NOTION_TOKEN}
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - default
      - notion-mcp-net
    restart: unless-stopped

  # 3. Worker Container (Background Job Processor)
  worker:
    image: converter-app:latest
    container_name: markdown-converter-worker
    command: python worker.py
    dns:
      - 8.8.8.8
      - 8.8.4.4
    volumes:
      # Shared volume for podcast files
      - podcast_data:/app/output_podcasts
      - ./google-credentials.json:/app/google-credentials.json:ro
      # SEC-SOCKET: KEIN Docker-Socket mehr. Der Worker parst fremde
      # Dokumente; Code-Ausfuehrung hier darf nicht zu Root ueber den Host
      # werden. Den Socket haelt allein der mineru-launcher (unten), der
      # Worker schickt ihm nur Daten (Job-Name, PDF-Name, Seitenzahl).
      # DOC-LOCAL: Austausch-Verzeichnis Worker ↔ Geschwister-Container als
      # HOST-Bind (kein Named Volume): der Geschwister-Container wird vom
      # HOST-Daemon gestartet, seine -v-Quellen muessen Host-Pfade sein —
      # ein Named Volume hat keinen stabilen, dokumentierten Host-Pfad.
      - ./doclocal_exchange:/app/doclocal_exchange
    environment:
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS}
      # SEC-REDIS-AUTH: token_urlsafe-Passwort, URL-sicher ohne Escaping.
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD fehlt in .env}@redis:6379/0
      # DOC-LOCAL: die Worker-Sicht der Austausch-Flaeche (legt die Eingabe
      # ab, liest die Ausgabe). Die Host-Sicht kennt seit SEC-SOCKET nur
      # noch der Launcher.
      - DOC_LOCAL_EXCHANGE_DIR=/app/doclocal_exchange
      - MINERU_LAUNCHER_URL=http://mineru-launcher:8765
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      mineru-launcher:
        condition: service_healthy
    networks:
      - default
      - launch
    restart: unless-stopped

  # 4. mineru-Launcher (SEC-SOCKET) — der EINZIGE Halter des Docker-Sockets.
  # ⚠️ Der Socket ist ROOT-AEQUIVALENT auf dem Host. Die DOC-LOCAL-
  # Entscheidung bleibt (GPU nur waehrend eines Auftrags, kein Dauer-Sidecar,
  # der 6,5 GB von 12 GB gegen ComfyUI hielte) — nur haelt den Socket jetzt
  # ein Dienst, der genau eine Sache kann: den gemessenen mineru-Vektor
  # (services/mineru_invocation.py) ueber ein Job-Verzeichnis fahren. Er baut
  # die Kommandozeile selbst, nimmt vom Worker nur Daten, faehrt einen Lauf
  # zur Zeit und entfernt einen Container, der seine Frist reisst. Ein
  # Socket-Proxy haette nicht gereicht: er filtert Pfad und Methode, nie den
  # Body — containers/create mit Binds ["/:/host"] ginge durch. Und er gibt
  # dem Daemon nie einen Pfad unterhalb des Austauschs als -v-Quelle: der
  # Daemon folgt Symlinks, ein vom Worker gebogenes out/ haette jeden
  # Host-Pfad in einen root-Container gemountet (gemessen). mineru bekommt
  # Volumes je Job; nur busybox-Helfer mounten die Austausch-WURZEL.
  # Bewusst OHNE env_file: der Socket-Halter traegt keine App-Geheimnisse,
  # kein Austausch-Mount (er reicht Host-Pfade durch, sieht keine Datei),
  # kein Port, nur das Netz launch.
  mineru-launcher:
    image: converter-app:latest
    container_name: mineru-launcher
    command: python -m services.mineru_launcher
    # SEC-NONROOT: das Image laeuft als uid 1000 (Dockerfile USER), der
    # Launcher bewusst als root — wer den Socket haelt, ist root-aequivalent,
    # egal unter welcher uid; ein USER hier waere Theater und braechte die
    # host-spezifische docker-gid (996) in diese Datei.
    user: "0:0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # Host-Sicht der Austausch-Flaeche. ${PWD} — Compose MUSS aus dem
      # Projektverzeichnis aufgerufen werden (dokumentierte Deploy-Praxis),
      # sonst zeigen Worker-Bind und Daemon-Sicht auf verschiedene
      # Verzeichnisse und jeder Lauf faellt auf die Textebene.
      - DOC_LOCAL_EXCHANGE_HOST_DIR=${PWD}/doclocal_exchange
      # uid:gid des WORKERS — die Ausgabe wird als dieser Nutzer in das
      # Job-Verzeichnis zurueckkopiert (Nachfolger des chown-Passes).
      # SEC-NONROOT: der Worker laeuft als 1000:1000 (Dockerfile USER).
      - EXCHANGE_OWNER=1000:1000
      # DOC-LOCAL: Image-Pin per Tag. mineru:latest hat KEINEN
      # Registry-Digest (lokal geladen, Image-ID 6cc9e57ff5bd, mineru 3.4.4,
      # Modell-Snapshot bff20d4 eingebacken) — der Tag `mineru:3.4.4` macht
      # einen stillen latest-Rebuild sichtbar: neuer latest traegt den Tag
      # nicht, der Lauf faellt kontrolliert auf die Textebene
      # (backend_fallback) statt still eine ungemessene Engine zu fahren.
      - MINERU_IMAGE=mineru:3.4.4
      # Host-Pfad des HF-Caches (Nachlade-Netz; die Gewichte selbst sind im
      # Image eingebacken — gemessen 2026-08-16). Leer = kein Mount.
      - MINERU_MODELS_DIR=${MINERU_MODELS_DIR:-}
      # Nur VERKUERZBAR (Kill-Probe, SEC-SOCKET P2): leer = 300 s Basis.
      # `MINERU_TIMEOUT_BASE_SECONDS=5 docker compose up -d mineru-launcher`
      # fuer die Probe, danach ohne die Variable erneut.
      - MINERU_TIMEOUT_BASE_SECONDS=${MINERU_TIMEOUT_BASE_SECONDS:-}
    networks:
      - launch
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 1s
    # SIGTERM entfernt einen laufenden mineru-Container, bevor der Launcher
    # endet (docker rm -f braucht Sekunden, nicht die 10 s Standard-Frist).
    stop_grace_period: 30s
    restart: unless-stopped

# Named volume for sharing podcast files between web and worker
volumes:
  podcast_data:
  app_data:

networks:
  notion-mcp-net:
    external: true
  # SEC-SOCKET: nur worker + mineru-launcher (Docker-Name converter_launch,
  # Projekt converter). internal = kein Weg nach draussen; der Worker hat
  # seinen Internetweg ueber default, der Launcher braucht keinen —
  # docker run geht ueber den Socket.
  launch:
    internal: true
