services:
  # 1. Redis - Job Queue Database (internal only, no port exposed)
  redis:
    image: redis:8.4-alpine
    container_name: file-transformer-redis
    # SEC-REDIS-AUTH (F-7): Redis verlangt ein Passwort aus .env — fail-closed,
    # ohne REDIS_PASSWORD startet Compose nichts (auch nicht Web/Worker unten).
    # Es reist per Env, nicht als Klartext im Compose. Der Umweg ueber
    # docker-entrypoint.sh ist Pflicht: nur wenn dessen erstes Argument
    # redis-server ist, dropt er auf den User redis und laedt die Module — ein
    # nacktes `sh -c "exec redis-server …"` liefe als root (gemessen). Redis
    # ueberschreibt seinen Prozesstitel, `ps` zeigt das Passwort nicht;
    # `docker inspect` zeigt es in Env wie jedes andere Secret der Box.
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD fehlt in .env}
    command: ["sh", "-c", "exec docker-entrypoint.sh redis-server --requirepass \"$$REDIS_PASSWORD\""]
    # redis-cli endet auch bei NOAUTH/WRONGPASS mit Exit 0 — erst das grep
    # macht aus der Antwort ein Urteil.
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # 2. Web Container (Flask API)
  markdown-converter:
    build:
      context: .
      cache_from:
        - converter-app:latest
    image: converter-app:latest
    container_name: markdown-converter-web
    dns:
      - 8.8.8.8
      - 8.8.4.4
    ports:
      # SEC-AUDIT: loopback only. Host nginx (proxy_pass 127.0.0.1:5656) is
      # the one way in from outside; the iOS app goes through nginx (https),
      # converter-mcp through Docker DNS (:5000). 0.0.0.0 served the app to
      # the LAN without TLS, past nginx's HSTS and login rate limit — and
      # ProxyFix trusts the X-Forwarded-* headers of whoever connects here.
      - "127.0.0.1:5656:5000"
    volumes:
      - ./google-credentials.json:/app/google-credentials.json
      # Shared volume for podcast files
      - podcast_data:/app/output_podcasts
      # Persistent database storage
      - app_data:/app/data
      # DOC-WEB-ASYNC: NO docker socket and NO mineru wiring on this
      # container. It is reachable from the internet (converter.smallpieces.de,
      # login-protected) — a ROOT-EQUIVALENT socket behind a single login
      # fence was the wrong trade. Browser PDFs run as a job on the worker
      # (the only socket holder); the upload travels over the shared
      # podcast_data volume, the worker's exchange bind is never touched here.
    environment:
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS}
      # SEC-REDIS-AUTH: token_urlsafe-Passwort, URL-sicher ohne Escaping.
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD fehlt in .env}@redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - NOTION_MCP_URL=http://notion-mcp-server:3333
      - MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN}
      - NOTION_TOKEN=${NOTION_TOKEN}
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - default
      - notion-mcp-net
    restart: unless-stopped

  # 3. Worker Container (Background Job Processor)
  worker:
    image: converter-app:latest
    container_name: markdown-converter-worker
    command: python worker.py
    dns:
      - 8.8.8.8
      - 8.8.4.4
    volumes:
      # Shared volume for podcast files
      - podcast_data:/app/output_podcasts
      - ./google-credentials.json:/app/google-credentials.json
      # DOC-LOCAL: Docker-Socket fuer den mineru-Geschwister-Container.
      # ⚠️ Der Socket ist ROOT-AEQUIVALENT auf dem Host — bewusste
      # Entscheidung (Sprint DOC-LOCAL, gesperrte Entscheidung 1): die GPU
      # ist nur waehrend eines Auftrags belegt (kein Dauer-Sidecar, der
      # 6,5 GB von 12 GB gegen ComfyUI/LoRA hielte), und die Invokation
      # bleibt die gemessene. Details: docs/document_api_contract.md §10.
      - /var/run/docker.sock:/var/run/docker.sock
      # DOC-LOCAL: Austausch-Verzeichnis Worker ↔ Geschwister-Container als
      # HOST-Bind (kein Named Volume): der Geschwister-Container wird vom
      # HOST-Daemon gestartet, seine -v-Quellen muessen Host-Pfade sein —
      # ein Named Volume hat keinen stabilen, dokumentierten Host-Pfad.
      - ./doclocal_exchange:/app/doclocal_exchange
    environment:
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS}
      # SEC-REDIS-AUTH: token_urlsafe-Passwort, URL-sicher ohne Escaping.
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD fehlt in .env}@redis:6379/0
      # DOC-LOCAL: dieselbe Austausch-Flaeche in beiden Sichten. HOST_DIR
      # nutzt ${PWD} — Compose MUSS aus dem Projektverzeichnis aufgerufen
      # werden (ist die dokumentierte Deploy-Praxis), sonst zeigen Worker-
      # Sicht und Daemon-Sicht auf verschiedene Verzeichnisse.
      - DOC_LOCAL_EXCHANGE_DIR=/app/doclocal_exchange
      - DOC_LOCAL_EXCHANGE_HOST_DIR=${PWD}/doclocal_exchange
      # DOC-LOCAL: Image-Pin per Tag. mineru:latest hat KEINEN
      # Registry-Digest (lokal geladen, Image-ID 6cc9e57ff5bd, mineru 3.4.4,
      # Modell-Snapshot bff20d4 eingebacken) — der Tag `mineru:3.4.4` wird
      # beim Deploy einmalig gesetzt (docker tag mineru:latest mineru:3.4.4)
      # und macht einen stillen latest-Rebuild sichtbar: neuer latest traegt
      # den Tag nicht, der Worker faellt kontrolliert auf die Textebene
      # (backend_fallback) statt still eine ungemessene Engine zu fahren.
      - MINERU_IMAGE=mineru:3.4.4
      # Host-Pfad des HF-Caches (Nachlade-Netz; die Gewichte selbst sind im
      # Image eingebacken — gemessen 2026-08-16). Leer = kein Mount.
      - MINERU_MODELS_DIR=${MINERU_MODELS_DIR:-}
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

# Named volume for sharing podcast files between web and worker
volumes:
  podcast_data:
  app_data:

networks:
  notion-mcp-net:
    external: true
